
services:
  backend:
    build:
      context: ..
      dockerfile: devops/backend/Dockerfile
    env_file:
      - ../.env
    ports:
      - "4430:4430"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, ssl; ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE; urllib.request.urlopen('https://localhost:4430/login', context=ctx, timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - weather-net

  pico:
    build:
      context: ..
      dockerfile: devops/firmware/Dockerfile
    env_file:
      - ../.env
    environment:
      WEATHER_API_HOST: backend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - weather-net

networks:
  weather-net: